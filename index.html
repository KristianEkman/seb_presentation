<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Building with AI for fun</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="deck">

    <!-- Slide 1: Title -->
    <section class="slide slide--title">
      <div class="brand">SEB</div>
      <div class="title-block">
        <span class="accent-bar"></span>
        <h1>Building with AI for fun</h1>
        <p class="subtitle">Chess engines, Games and what I learned.</p>
      </div>
      <footer class="footnote">Kristian Ekman, 2026-11-20</footer>
    </section>

    <!-- Slide 2: Findings -->
    <section class="slide slide--content">
      <div class="brand">SEB</div>
      <div class="content-block">
        <span class="accent-bar"></span>
        <h2>Findings</h2>
        <ul class="points">
          <li>AI is better than I thought.</li>
          <li>Split tasks into sub-tasks for better results.</li>
          <li>Guide AI as much as possible, review and test.</li>
        </ul>
      </div>
    </section>

  </main>

  <div class="progress"><div class="progress__bar"></div></div>
  <div class="counter"></div>

  <script src="script.js"></script>
</body>
</html>
